<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blue Nitro</title>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"></script>

    <style>
      header {
        background: #fff;
      }

      body {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        font-family: 'Playfair Display', serif;
      }

      footer {
        background: #324cd9;
        color: #fff;
      }

      .video-thumb {
        cursor: pointer;
        transition: transform 0.2s ease;
      }

      .video-thumb:hover {
        transform: scale(1.05);
      }
    </style>
  </head>
  <body>
    <header>
      <div class="container py-2 d-flex align-items-center">
        <a href="/">
          <img src="blue-nitro-sm.png" alt="Blue Nitro">
        </a>
      </div>
    </header>
    <main class="container my-5 flex-grow-1">
      <h2 class="text-center mb-4" style="color:#1b1677;">Blue Nitro Solar Videos</h2>

      <div class="row g-4">
        <div class="col-md-4 text-center">
          <video controls playsinline preload="metadata" class="w-100 video-thumb" poster="/videos/blue-nitro-1.png">
            <source src="/videos/blue-nitro-1.mp4" type="video/mp4">
          </video>
          <p style="">Solar Video 1</p>
          <p>Run Time: 24.04 seconds</p>
        </div>

        <div class="col-md-4 text-center">
          <video controls playsinline preload="metadata" class="w-100 video-thumb" poster="/videos/blue-nitro-2.png">
            <source src="/videos/blue-nitro-2.mp4" type="video/mp4">
          </video>
          <p style="">Solar Video 2</p>
          <p>Run Time: 18.16 seconds</p>
        </div>

        <div class="col-md-4 text-center">
          <video video controls playsinline preload="metadata" class="w-100 video-thumb" poster="/videos/blue-nitro-3.png">
            <source src="/videos/blue-nitro-3.mp4" type="video/mp4">
          </video>
          <p style="">Solar Video 3</p>
          <p>Run Time: 21.79 seconds</p>
        </div>
      </div>
    </main>
    <footer class="py-3">
      <div class="container d-flex justify-content-between">
        <span>Blue Nitro</span>
        <span>1001-901</span>
      </div>
    </footer>
  </body>
</html>
